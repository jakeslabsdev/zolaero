# You can inject your own stylesheet here
custom_css = []

# Default navigation menu
zolaero_menu = [
    { name = "/home/", url = "/" },
    { name = "/archive/", url = "/archive/" },
    { name = "/tags/", url = "/tags/" },
    { name = "/about/", url = "/about/" },
]