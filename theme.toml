name = "zolaero"
description = "A minimalist Frutiger Aero theme for technical writeups."
license = "MIT"
homepage = "https://github.com/jakeslabsdev/zolaero"

# Default variables for the theme. 
# You can overwrtie this in your own config.toml.
[extra]
author_name = "JakeS"
